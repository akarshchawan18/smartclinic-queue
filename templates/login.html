{% extends "base.html" %}
{% block title %}Staff login · {{ clinic }}{% endblock %}
{% block content %}
<div class="panel">
  <h1>Staff login</h1>
  <p class="muted">Enter your reception PIN to manage the queue.</p>
  {% if error %}<div class="err" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="/staff/login">
    <label for="pin">PIN</label>
    <input id="pin" name="pin" type="password" inputmode="numeric" required autofocus>
    <button class="full">Log in</button>
  </form>
</div>
{% endblock %}
